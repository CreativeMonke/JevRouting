# Same routing, but talking to the agent CLIs directly (no LiteLLM).
# Used for live end-to-end tests: `jev route --config examples/cli.config.yaml "..."`.

jev:
  timeoutMs: 4000
  # Ordered failover chain. A backend is skipped when any `requires` value is empty, so
  # each one switches on just by setting its env vars. Rate-limited backends (429) are
  # skipped until their Retry-After passes.
  backends:
    - name: local-clef              # Cloudflare Clef-flash on this Mac via MLX (scripts/clef-serve.sh)
      baseUrl: ${JEV_LOCAL_URL}
      model: clef-flash
      timeoutMs: 30000              # requests run one at a time on the GPU; ~4 ms per input token on an M4
      maxRetries: 0                 # a retry after a timeout just queues duplicate work behind the first
      requires: ["${JEV_LOCAL_URL}"]
    - name: opencode-zen            # TypeSafe Jev hosted free by OpenCode Zen
      baseUrl: https://opencode.ai/zen/v1
      apiKey: ${JEV_API_KEY}
      model: jev-1.13-free
      requires: ["${JEV_API_KEY}"]
    - name: cloudflare-clef-flash   # Workers AI (10K free neurons/day)
      transport: workers-ai
      baseUrl: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}
      apiKey: ${CLOUDFLARE_AUTH_TOKEN}
      model: clef-flash
      requires: ["${CLOUDFLARE_ACCOUNT_ID}", "${CLOUDFLARE_AUTH_TOKEN}"]
    - name: typesafe
      baseUrl: https://api.typesafe.ai/v1
      apiKey: ${TYPESAFE_API_KEY}
      model: jev-1.13.0
      requires: ["${TYPESAFE_API_KEY}"]

routing:
  fallback: [opencode-openrouter-free]

telemetry:
  logFile: logs/decisions-cli.jsonl

providers:
  claude-opus:
    kind: cli
    preset: claude-code
    model: claude-opus-5-5
    catalogId: claude-opus-5-5
    billing: subscription
    efforts: [medium, high]
    strengths: Strongest reasoning; architecture, hard debugging, security-sensitive work.
  claude-sonnet:
    kind: cli
    preset: claude-code
    model: claude-sonnet-5-5
    catalogId: claude-sonnet-5-5
    billing: subscription
    efforts: [low, medium, high]
    strengths: Strong all-round coder; features, refactors, tests and reviews.
  claude-haiku:
    kind: cli
    preset: claude-code
    model: claude-haiku-5-5
    catalogId: claude-haiku-5-5
    billing: subscription
    efforts: [low, medium, high]
    strengths: Fast and cheap; small edits, explanations, docs.
  agy-gemini-flash:
    # Antigravity over ACP via the agy server bundled with T3 Code (reuses T3's Google session).
    kind: acp
    preset: antigravity
    model: gemini-3.8-flash-{effort}
    catalogId: gemini-3-8-flash
    billing: subscription
    harnessTokens: 12000
    efforts: [low, medium, high]
    strengths: Fast Gemini with huge context; reading large codebases, UI work.
  agy-cli-gemini-flash:
    # Same models through the bare `agy` CLI: needs a one-time browser sign-in, so off by default.
    kind: cli
    preset: antigravity
    model: gemini-3.8-flash-medium
    catalogId: gemini-3-8-flash
    billing: subscription
    efforts: [medium]
    enabled: false
  opencode-glm-flash:
    kind: cli
    preset: opencode
    model: opencode/glm-5.3-flash-free
    catalogId: glm-5-3-flash
    billing: free
    efforts: [max]
    maxIntelligence: 46
    strengths: Free, capable on routine coding; slow and verbose.
  opencode-openrouter-free:
    kind: cli
    preset: opencode
    model: openrouter/openrouter/free
    billing: free
    intelligence: 30
    maxIntelligence: 32
    strengths: Free last-resort model for trivial requests.
